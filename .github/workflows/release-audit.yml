name: Numerical audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify released results
        run: python code/verify_release.py
      - name: Run input-contract tests
        run: make test
      - name: Confirm deterministic report
        run: git diff --exit-code -- results/release_audit_report.md
